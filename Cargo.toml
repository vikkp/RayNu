[package]
name = "r640-hypervisor"
version = "0.1.0"
edition = "2021"
description = "RayNu-V — formally verified bare-metal hypervisor (Dell R640-first)"
license = "BUSL-1.1"
publish = false
default-run = "r640-hypervisor"

# Host-only Verus model crate (`ept_model`) is a workspace member but not a
# dependency of the UEFI binary. `default-members` keeps `cargo test` on root.
[workspace]
members = [".", "ept_model"]
default-members = ["."]
resolver = "2"

[lib]
name = "r640_hypervisor"
path = "src/lib.rs"

[[bin]]
name = "r640-hypervisor"
path = "src/main.rs"
required-features = ["uefi-bin"]

[features]
# Host `cargo test` uses default features (no UEFI).
# Firmware build: --features uefi-bin --target x86_64-unknown-uefi
default = []
uefi-bin = ["dep:uefi", "dep:smoltcp"]

[dependencies]
uefi = { version = "0.33", optional = true, features = ["panic_handler", "logger", "alloc"] }
# ADR-012 SNP residual: minimal TCP/IP when firmware Tcp4 is absent (size-audited).
smoltcp = { version = "0.13", optional = true, default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "auto-icmp-echo-reply",
] }

# M8.1 freestanding TLS 1.2 (ADR-003). rustls/ring stay host-only:
# ring's C build needs <assert.h> on x86_64-unknown-uefi. These crates are
# pure Rust (no libc) so they can join the firmware listen path.
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
hmac = { version = "0.12", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic"] }
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
sha2 = { version = "0.10", default-features = false }

# Host rustls client proves the firmware TLS 1.2 server (not iron TLS-OK).
[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = "symbols"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

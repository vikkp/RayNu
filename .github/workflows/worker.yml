name: worker

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy raynuv.com Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HDA tracker fresh
        run: ./tools/sync-hda-site.sh --check
      - name: Deploy Worker with static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm
          wranglerVersion: "4.125.0"
      - name: Purge Cloudflare edge cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
        run: |
          set -euo pipefail
          # Custom API tokens 401 on /purge_cache despite Cache Purge:Purge
          # showing in the dashboard (known Cloudflare quirk — the internal
          # purge-write scope is not applied to custom tokens). The Global
          # API Key works, so prefer it when present; token is the fallback.
          if [ -n "${CF_EMAIL}" ] && [ -n "${CF_KEY}" ]; then
            AUTH=(-H "X-Auth-Email: ${CF_EMAIL}" -H "X-Auth-Key: ${CF_KEY}")
          else
            AUTH=(-H "Authorization: Bearer ${CF_TOKEN}")
          fi
          resp=$(curl -s -w "\n%{http_code}" \
            "https://api.cloudflare.com/client/v4/zones?name=raynuv.com" \
            "${AUTH[@]}")
          code=$(tail -n1 <<<"$resp")
          if [ "$code" != "200" ]; then
            echo "zone lookup failed: HTTP $code"
            sed '$d' <<<"$resp"
            exit 1
          fi
          ZONE_ID=$(sed '$d' <<<"$resp" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
          presp=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          pcode=$(tail -n1 <<<"$presp")
          if [ "$pcode" != "200" ]; then
            echo "purge failed: HTTP $pcode"
            sed '$d' <<<"$presp"
            exit 1
          fi
          echo "purged edge cache for zone $ZONE_ID"

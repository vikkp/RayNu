          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 ovmf
      - name: M7.7 ISO install QEMU lab smoke
        run: |
          if grep -qw vmx /proc/cpuinfo && [[ -r /dev/kvm && -w /dev/kvm ]]; then
            REQUIRE_VMX=1 QEMU_ACCEL=kvm ./tools/m7-iso-install-qemu-smoke.sh
          elif [[ -r /dev/kvm && -w /dev/kvm ]]; then
            REQUIRE_VMX=0 QEMU_ACCEL=kvm ./tools/m7-iso-install-qemu-smoke.sh
          else
            REQUIRE_VMX=0 QEMU_ACCEL=tcg ./tools/m7-iso-install-qemu-smoke.sh
          fi
      - name: Upload E5 ISO install serial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-iso-install-serial
          path: |
            target/e5-iso-install-serial.log
            target/e5-iso-reboot-serial.log
            target/e5-iso-install-qemu-stdout.log
            target/e5-iso-install-qemu-stderr.log
            target/e5-iso-reboot-qemu-stdout.log
            target/e5-iso-reboot-qemu-stderr.log
            target/e5-lab-install.img
          if-no-files-found: ignore

